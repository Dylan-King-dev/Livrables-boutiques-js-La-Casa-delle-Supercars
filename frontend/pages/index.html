<!DOCTYPE html>
<html lang="fr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/account-drawer.css">
    <script src="../js/main.js" defer></script>
    <title>Accueil</title>  
</head>
<body>

    <header class="header">  
        <button class ="hamburger" id="menuBtn" aria-label="Open menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <div class="logo">
            <a href="index.html"><img src="../assets/img/logos/Red car house emblem logo.png" alt="LA CASA"></a>
        </div>
        <div class="header-actions">
            <a class="header-link" href="login.html" data-account-link aria-label="Se connecter">
                <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M4 20c1.7-3.6 5-5.5 8-5.5s6.3 1.9 8 5.5"></path>
                </svg>
            </a>
            <a class="header-link" href="panier.html" aria-label="Panier">
                <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 7h10l-1.2 11H8.2L7 7z"></path>
                    <path d="M9 7V5a3 3 0 0 1 6 0v2"></path>
                </svg>
            </a>
        </div>
    </header>

    <main> 
        <div class="hero">
            <div class="hero-left">
                <img src="../assets/img/maserati/Maserati-index.png" alt="Maserati">
                <div class="hero-content">
                    <a href="catalogueMaserati.html" class="btn-cta">Découvrir</a>
                </div>
            </div>
            <div class="hero-right">
                <img src="../assets/img/porsche/Porsche-index.png" alt="Porsche">
                <div class="hero-content">
                    <a href="cataloguePorsche.html" class="btn-cta">Découvrir</a>
                </div>
            </div>
        </div>
    </main>
     <div class="overlay" id="overlay">
 
    <div class="menu-panel" id="menuPanel">
      <div class="menu-subheader" id="menuSubheader">
        <button class="menu-back" id="menuBack" aria-label="Retour">
          <svg class="menu-back-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M12.5 4.5L7 10l5.5 5.5"></path>
          </svg>
          <img id="menuSubImg" src="" alt="">
        </button>
      </div>
      <div class="menu-search">
        <input type="search" placeholder="Écrivez Ici" aria-label="Search">
      </div>
      <ul class="menu-items main-menu" id="menuItems">
        <li class="menu-item menu-item--has-submenu" data-image="../assets/img/maserati/maserati logo writing.png">
          <img src="../assets/img/maserati/maserati logo writing.png" alt="Maserati">
        </li>
        <li class="menu-item menu-item--has-submenu" data-image="../assets/img/porsche/porsche logo writing.png">
          <img src="../assets/img/porsche/porsche logo writing.png" alt="Porsche">
        </li>
        <li class="menu-item menu-item-text">FAVORIS</li>
        <li class="menu-item menu-item-text">PANIER</li>
        <li class="menu-item menu-item-text">PROFILE</li>
      </ul>
 
    </div>
 
    <div class="backdrop" id="backdrop"></div>
 
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
  <aside class="account-drawer" id="accountDrawer" aria-hidden="true">
    <div class="drawer-header">
      <span class="drawer-title">Compte</span>
      <button class="drawer-close" type="button" data-drawer-close aria-label="Fermer">×</button>
    </div>
    <div class="drawer-body">
      <p>Connectez-vous pour retrouver vos favoris, votre panier et vos commandes.</p>
    </div>
    <div class="drawer-actions">
      <a class="primary" href="login.html">Se connecter</a>
      <a href="register.html">Créer un compte</a>
    </div>
  </aside>
  <script src="../js/account-drawer.js"></script>
</body>
</html>
