<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Créer un compte | La Casa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c0f14;
      --ink-soft: #1b2330;
      --paper: #f6f3ef;
      --sand: #e7e0d6;
      --accent: #2b2f36;
      --accent-dark: #15191f;
      --mist: rgba(12, 15, 20, 0.55);
      --shadow: 0 25px 60px rgba(12, 15, 20, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7vw 0 4vw;
      background: rgba(12, 15, 20, 0.72);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 10;
    }

    .topbar-logo img {
      height: 64px;
      width: auto;
      filter: brightness(1.1);
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .topbar-actions a {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .topbar-actions a:hover {
      border-color: #fff;
      color: #fff;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 120px 7vw 8vh;
    }

    .card {
      width: min(520px, 92vw);
      background: #fff;
      border-radius: 16px;
      padding: 28px 26px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 18px;
    }

    .card h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(22px, 2.6vw, 30px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card p {
      color: var(--mist);
      font-size: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    input {
      border: 1px solid rgba(12, 15, 20, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
    }

    .grid-2 {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 11px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .btn.secondary {
      background: transparent;
      color: var(--accent);
    }

    .links {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--mist);
    }

    @media (max-width: 900px) {
      .topbar-actions { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-logo">
      <a href="index.html">
        <img src="../assets/img/logos/Red%20car%20house%20emblem%20logo.png" alt="La Casa" />
      </a>
    </div>
    <div class="topbar-actions">
      <a href="index.html">Accueil</a>
      <a href="catalogueMaserati.html">Maserati</a>
      <a href="cataloguePorsche.html">Porsche</a>
      <a href="favoris.html">Favoris</a>
      <a href="panier.html">Panier</a>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h1>Créer un compte</h1>
      <p>Créez votre compte pour enregistrer vos favoris et suivre vos commandes.</p>

      <div class="grid-2">
        <div class="field">
          <label for="firstName">Prénom</label>
          <input id="firstName" type="text" placeholder="Prénom" />
        </div>
        <div class="field">
          <label for="lastName">Nom</label>
          <input id="lastName" type="text" placeholder="Nom" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nom@exemple.com" />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>

      <div class="field">
        <label for="confirm">Confirmer le mot de passe</label>
        <input id="confirm" type="password" placeholder="••••••••" />
      </div>

      <div class="links">
        <span>Déjà un compte ?</span>
        <a href="login.html">Se connecter</a>
      </div>

      <div class="actions">
        <button class="btn" type="button">Créer un compte</button>
        <button class="btn secondary" type="button" id="guestContinue">Continuer en invité</button>
      </div>
    </section>
  </main>
  <script>
    const guestBtn = document.getElementById("guestContinue");
    guestBtn.addEventListener("click", () => {
      if (document.referrer) {
        window.location.href = document.referrer;
      } else {
        window.history.back();
      }
    });
  </script>
</body>
</html>
