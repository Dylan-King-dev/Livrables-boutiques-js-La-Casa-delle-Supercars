<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Créer un compte | La Casa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/register.css" />
  <link rel="stylesheet" href="../assets/css/footer.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-logo">
      <a href="index.html">
        <img src="../assets/img/logos/Red%20car%20house%20emblem%20logo.png" alt="La Casa" />
      </a>
    </div>
    <div class="topbar-actions">
      <a href="index.html">Accueil</a>
      <a href="catalogueMaserati.html">Maserati</a>
      <a href="cataloguePorsche.html">Porsche</a>
      <a href="favoris.html">Favoris</a>
      <a href="panier.html">Panier</a>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h1>Créer un compte</h1>
      <p>Créez votre compte pour enregistrer vos favoris et suivre vos commandes.</p>

      <div class="grid-2">
        <div class="field">
          <label for="firstName">Prénom</label>
          <input id="firstName" type="text" placeholder="Prénom" />
        </div>
        <div class="field">
          <label for="lastName">Nom</label>
          <input id="lastName" type="text" placeholder="Nom" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nom@exemple.com" />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" placeholder="Mot de passe" />
      </div>

      <div class="field">
        <label for="confirm">Confirmer le mot de passe</label>
        <input id="confirm" type="password" placeholder="Confirmer le mot de passe" />
      </div>

      <div class="links">
        <span>Déjà un compte ?</span>
        <a href="login.html">Se connecter</a>
      </div>

      <div class="actions">
        <button class="btn" type="button">Créer un compte</button>
        <button class="btn secondary" type="button" id="guestContinue">Continuer en invité</button>
      </div>
    </section>
  </main>
  <script src="../js/register.js"></script>
  <footer class="site-footer">
    <div class="footer-col">
      <strong>La Casa</strong>
      <span>Atelier Supercars</span>
    </div>
    <div class="footer-col">
      <a href="cataloguePorsche.html">Porsche</a>
      <a href="catalogueMaserati.html">Maserati</a>
      <a href="index.html">Accueil</a>
    </div>
    <div class="footer-col">
      <a href="favoris.html">Favoris</a>
      <a href="panier.html">Panier</a>
      <a href="login.html">Compte</a>
    </div>
    <div class="footer-col">
      <span>Livraison sécurisée</span>
      <span>Service client</span>
      <span>Essais privés</span>
    </div>
  </footer></body>
</html>
